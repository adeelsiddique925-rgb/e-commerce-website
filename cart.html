<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | Hearth & Home</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="logo" href="index.html">Hearth<span>&Home</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a class="active" href="cart.html">Cart <span class="cart-count" data-cart-count>0</span></a>
            </div>
        </nav>
    </header>

    <main>
        <section class="page-title">
            <h1>Your cart</h1>
            <p>Review the items you added. Use the remove button if you change your mind.</p>
        </section>

        <section class="cart-layout">
            <div class="cart-panel" id="cart-items"></div>
            <aside class="cart-panel" aria-label="Cart summary">
                <h2>Order summary</h2>
                <div class="total-row">
                    <span>Total</span>
                    <span id="cart-total">$0.00</span>
                </div>
                <p class="empty-message">Checkout is not connected because this is a front-end class project.</p>
                <a class="button secondary" href="products.html">Continue shopping</a>
            </aside>
        </section>
    </main>

    <footer class="site-footer">
        <p>Hearth & Home student shop project.</p>
    </footer>

    <script src="data.js"></script>
    <script src="cart.js"></script>
    <script src="cart-page.js"></script>
</body>
</html>
